<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Mix" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .mix-colors { isolation: isolate; }
    .mix-color { mix-blend-mode: screen; animation: mix-move 7s ease-in-out infinite alternate; }
    .mix-color-2 { animation-name: mix-move-2; animation-duration: 9s; }
    .mix-color-3 { animation-name: mix-move-3; animation-duration: 8s; }
    @keyframes mix-move { from { transform: translate(0, -26px); } to { transform: translate(0, 30px); } }
    @keyframes mix-move-2 { from { transform: translate(-30px, 14px); } to { transform: translate(34px, -18px); } }
    @keyframes mix-move-3 { from { transform: translate(30px, 14px); } to { transform: translate(-34px, -18px); } }
  </style>
  <defs>
    <linearGradient id="mix-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120B3A" /><stop offset="1" stop-color="#2F1F63" /></linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#mix-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".25" />
  <g class="mix-colors">
    <circle class="mix-color" cx="400" cy="226" r="150" fill="#39C7E0" />
    <circle class="mix-color mix-color-2" cx="322" cy="362" r="150" fill="#F03FB8" />
    <circle class="mix-color mix-color-3" cx="478" cy="362" r="150" fill="#E8C63A" />
  </g>
  <text x="422" y="690" text-anchor="middle" font-family="Jost, sans-serif" font-weight="200" font-size="124" letter-spacing="44" fill="#FFF6FB">MIX</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
