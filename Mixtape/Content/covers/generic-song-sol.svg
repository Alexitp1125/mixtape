<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .gsol-rays { transform-box: fill-box; transform-origin: center; animation: gsol-turn 40s linear infinite; }
    @keyframes gsol-turn { to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="gsol-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9EE7F2" />
      <stop offset=".7" stop-color="#FFF1A8" />
    </linearGradient>
    <linearGradient id="gsol-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C" />
      <stop offset="1" stop-color="#FF7CC8" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#gsol-sky)" />

  <!-- sun with its rays -->
  <circle class="gsol-rays" cx="400" cy="320" r="190" fill="none" stroke="#3A2766" stroke-width="2" stroke-dasharray="4 18" opacity=".5" />
  <circle cx="400" cy="320" r="150" fill="url(#gsol-sun)" />

  <!--title #3A2766-->
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
