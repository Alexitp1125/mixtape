<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Al Sudeste" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .sudeste-needle { transform-origin: 400px 330px; transform: rotate(135deg); animation: sudeste-seek 6s ease-in-out infinite; }
    .sudeste-route { animation: sudeste-flow 8s linear infinite; }
    @keyframes sudeste-seek { 0%, 100% { transform: rotate(128deg); } 50% { transform: rotate(142deg); } }
    @keyframes sudeste-flow { to { stroke-dashoffset: -160; } }
  </style>
  <defs>
    <linearGradient id="sudeste-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241650" />
      <stop offset=".6" stop-color="#2F1F63" />
      <stop offset="1" stop-color="#6E59C2" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#sudeste-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".25" />

  <!-- compass -->
  <circle cx="400" cy="330" r="200" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".5" />
  <circle cx="400" cy="330" r="184" fill="none" stroke="#9EE7F2" stroke-width="10" stroke-dasharray="2 14.06" opacity=".7" />
  <g stroke="#C9B8F5" stroke-width="1" opacity=".45">
    <line x1="400" y1="176" x2="400" y2="484" />
    <line x1="246" y1="330" x2="554" y2="330" />
  </g>
  <g font-family="'Space Mono', monospace" font-size="20" fill="#FFF6FB" text-anchor="middle" opacity=".85">
    <text x="400" y="118">N</text>
    <text x="624" y="337">E</text>
    <text x="400" y="560">S</text>
    <text x="176" y="337">O</text>
  </g>

  <!-- the way to the southeast -->
  <line class="sudeste-route" x1="540" y1="470" x2="690" y2="620" stroke="#F4B9DF" stroke-width="3" stroke-dasharray="4 16" stroke-linecap="round" />
  <path d="M700,612 L705,625 L718,630 L705,635 L700,648 L695,635 L682,630 L695,625 Z" fill="#FFE45C" />

  <!-- needle: drawn pointing north, turned to the southeast -->
  <g class="sudeste-needle">
    <path d="M400,186 L422,330 L378,330 Z" fill="#FF5FD1" />
    <path d="M400,474 L422,330 L378,330 Z" fill="#FFF6FB" opacity=".85" />
  </g>
  <circle cx="400" cy="330" r="9" fill="#241650" stroke="#FFF6FB" stroke-width="3" />

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#9EE7F2" opacity=".7">II</text>
  <text x="407" y="690" text-anchor="middle" font-family="Jost, sans-serif" font-weight="200" font-size="72" letter-spacing="14" fill="#FFF6FB">AL SUDESTE</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
