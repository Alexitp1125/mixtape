<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .gondas-ring { transform-box: fill-box; transform-origin: center; animation: gondas-wave 4s ease-in-out infinite alternate; }
    .gondas-ring-2 { animation-delay: -.6s; }
    .gondas-ring-3 { animation-delay: -1.2s; }
    .gondas-ring-4 { animation-delay: -1.8s; }
    .gondas-ring-5 { animation-delay: -2.4s; }
    @keyframes gondas-wave { from { transform: scale(.94); } to { transform: scale(1.06); } }
  </style>
  <defs>
    <linearGradient id="gondas-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1146" />
      <stop offset="1" stop-color="#6E59C2" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#gondas-sky)" />

  <!-- sound waves around a dot -->
  <g fill="none" stroke="#9EE7F2">
    <circle class="gondas-ring" cx="400" cy="320" r="70" stroke-width="3" opacity=".9" />
    <circle class="gondas-ring gondas-ring-2" cx="400" cy="320" r="104" stroke-width="2.6" opacity=".75" />
    <circle class="gondas-ring gondas-ring-3" cx="400" cy="320" r="138" stroke-width="2.2" opacity=".6" />
    <circle class="gondas-ring gondas-ring-4" cx="400" cy="320" r="172" stroke-width="1.8" opacity=".45" />
    <circle class="gondas-ring gondas-ring-5" cx="400" cy="320" r="206" stroke-width="1.4" opacity=".3" />
  </g>
  <circle cx="400" cy="320" r="44" fill="#FF5FD1" />

  <!--title #FFF6FB-->
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
