<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Comienzo y Final de una Verde Mañana" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .verde-sun { transform-origin: 400px 560px; animation: verde-day 24s ease-in-out infinite alternate; }
    .verde-ray { transform-box: fill-box; transform-origin: center; animation: verde-turn 40s linear infinite; }
    @keyframes verde-day { from { transform: rotate(-62deg); } to { transform: rotate(62deg); } }
    @keyframes verde-turn { to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="verde-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FDBEA" />
      <stop offset=".5" stop-color="#C4F2DC" />
      <stop offset=".75" stop-color="#FFF1A8" />
    </linearGradient>
    <linearGradient id="verde-sun-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C" />
      <stop offset="1" stop-color="#FF7CC8" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#verde-sky)" />

  <!-- path of the day: where the morning starts and where it ends -->
  <path d="M100,560 A300,300 0 0 1 700,560" fill="none" stroke="#3A2766" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round" opacity=".55" />

  <!-- sun, travelling along the path -->
  <g class="verde-sun">
    <circle class="verde-ray" cx="400" cy="260" r="78" fill="none" stroke="#3A2766" stroke-width="2" stroke-dasharray="4 18" opacity=".5" />
    <circle cx="400" cy="260" r="56" fill="url(#verde-sun-fill)" />
  </g>

  <!-- green hills -->
  <path d="M0,560 C120,500 250,500 380,548 C520,600 660,520 800,540 L800,800 L0,800 Z" fill="#5FD3A6" />
  <path d="M0,610 C160,560 300,620 440,600 C580,580 690,600 800,580 L800,800 L0,800 Z" fill="#8FE6C2" />
  <path d="M0,690 C200,650 420,700 800,660 L800,800 L0,800 Z" fill="#B9F3D9" />

  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#3A2766" stroke-width="1" opacity=".22" />

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#3A2766" opacity=".6">I</text>
  <text x="404" y="622" text-anchor="middle" font-family="'Space Mono', monospace" font-size="19" letter-spacing="8" fill="#3A2766" opacity=".8">COMIENZO Y FINAL DE UNA</text>
  <text x="406" y="700" text-anchor="middle" font-family="Jost, sans-serif" font-weight="300" font-size="66" letter-spacing="12" fill="#3A2766">VERDE MAÑANA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
