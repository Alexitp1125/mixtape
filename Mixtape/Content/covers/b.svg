<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="B" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .b-echo-left { animation: b-left 5s ease-in-out infinite alternate; }
    .b-echo-right { animation: b-right 5s ease-in-out infinite alternate; }
    .b-floor { animation: b-floor 3s linear infinite; }
    @keyframes b-left { from { transform: translateX(-6px); } to { transform: translateX(-30px); } }
    @keyframes b-right { from { transform: translateX(6px); } to { transform: translateX(30px); } }
    @keyframes b-floor { to { stroke-dashoffset: -48; } }
  </style>
  <defs>
    <linearGradient id="b-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241650" />
      <stop offset=".62" stop-color="#4A2F9A" />
      <stop offset=".78" stop-color="#FF5FD1" />
      <stop offset=".78" stop-color="#241650" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#b-sky)" />

  <!-- floor: lines running to the horizon -->
  <g stroke="#FF5FD1" stroke-width="1.5" opacity=".7">
    <line x1="0" y1="624" x2="800" y2="624" />
    <line x1="0" y1="646" x2="800" y2="646" opacity=".8" />
    <line x1="0" y1="680" x2="800" y2="680" opacity=".6" />
    <line x1="0" y1="730" x2="800" y2="730" opacity=".45" />
    <path class="b-floor" d="M400,624 L400,800 M330,624 L190,800 M260,624 L-20,800 M190,624 L-230,800 M470,624 L610,800 M540,624 L820,800 M610,624 L1030,800" fill="none" stroke-dasharray="24 24" opacity=".55" />
  </g>

  <!-- the letter, with its two echoes -->
  <g font-family="Jost, sans-serif" font-weight="400" font-size="560" text-anchor="middle">
    <text class="b-echo-left" x="400" y="600" fill="none" stroke="#7FDBEA" stroke-width="3">B</text>
    <text class="b-echo-right" x="400" y="600" fill="none" stroke="#FF7CC8" stroke-width="3">B</text>
    <text x="400" y="600" fill="#FFF6FB">B</text>
  </g>

  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".25" />
  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#9EE7F2" opacity=".7">IV</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
