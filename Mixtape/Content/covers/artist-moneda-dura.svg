<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Moneda Dura" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .monedas-coin { transform-box: fill-box; transform-origin: center; animation: monedas-flip 8s ease-in-out infinite; }
    @keyframes monedas-flip { 0%, 78%, 100% { transform: scaleX(1); } 86% { transform: scaleX(.06); } 94% { transform: scaleX(1); } }
  </style>
  <defs>
    <linearGradient id="monedas-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241650" />
      <stop offset=".6" stop-color="#4A2F9A" />
      <stop offset="1" stop-color="#9B7BE0" />
    </linearGradient>
    <linearGradient id="monedas-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE45C" />
      <stop offset="1" stop-color="#FF7CC8" />
    </linearGradient>
    <linearGradient id="monedas-aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9EE7F2" />
      <stop offset="1" stop-color="#8F7BFF" />
    </linearGradient>
    <linearGradient id="monedas-rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4B9DF" />
      <stop offset="1" stop-color="#FF5FD1" />
    </linearGradient>
    <linearGradient id="monedas-cream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6FB" />
      <stop offset="1" stop-color="#C9B8F5" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#monedas-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".25" />

  <!-- a handful of coins; each one flips at its own time -->
  <g class="monedas-coin" style="animation-delay: -1.0s">
    <circle cx="250" cy="392" r="84" fill="url(#monedas-aqua)" />
    <circle cx="250" cy="392" r="77" fill="none" stroke="#3A2766" stroke-width="7" stroke-dasharray="3 8" opacity=".65" />
    <circle cx="250" cy="392" r="62" fill="none" stroke="#3A2766" stroke-width="2.5" opacity=".6" />
    <ellipse cx="211" cy="350" rx="17" ry="8" transform="rotate(-40 211 350)" fill="#FFF6FB" opacity=".85" />
  </g>
  <g class="monedas-coin" style="animation-delay: -3.2s">
    <circle cx="566" cy="386" r="92" fill="url(#monedas-rose)" />
    <circle cx="566" cy="386" r="85" fill="none" stroke="#3A2766" stroke-width="7" stroke-dasharray="3 8" opacity=".65" />
    <circle cx="566" cy="386" r="68" fill="none" stroke="#3A2766" stroke-width="2.5" opacity=".6" />
    <ellipse cx="524" cy="340" rx="18" ry="8" transform="rotate(-40 524 340)" fill="#FFF6FB" opacity=".85" />
  </g>
  <g class="monedas-coin" style="animation-delay: -4.6s">
    <circle cx="316" cy="214" r="58" fill="url(#monedas-cream)" />
    <circle cx="316" cy="214" r="51" fill="none" stroke="#3A2766" stroke-width="6" stroke-dasharray="3 8" opacity=".65" />
    <circle cx="316" cy="214" r="43" fill="none" stroke="#3A2766" stroke-width="2.5" opacity=".6" />
    <ellipse cx="289" cy="185" rx="12" ry="5" transform="rotate(-40 289 185)" fill="#FFF6FB" opacity=".85" />
  </g>
  <g class="monedas-coin" style="animation-delay: -5.8s">
    <circle cx="512" cy="222" r="50" fill="url(#monedas-gold)" />
    <circle cx="512" cy="222" r="43" fill="none" stroke="#3A2766" stroke-width="6" stroke-dasharray="3 8" opacity=".65" />
    <circle cx="512" cy="222" r="37" fill="none" stroke="#3A2766" stroke-width="2.5" opacity=".6" />
    <ellipse cx="489" cy="197" rx="10" ry="4" transform="rotate(-40 489 197)" fill="#FFF6FB" opacity=".85" />
  </g>
  <g class="monedas-coin" style="animation-delay: 0s">
    <circle cx="400" cy="316" r="128" fill="url(#monedas-gold)" />
    <circle cx="400" cy="316" r="121" fill="none" stroke="#3A2766" stroke-width="10" stroke-dasharray="3 8" opacity=".65" />
    <circle cx="400" cy="316" r="95" fill="none" stroke="#3A2766" stroke-width="2.5" opacity=".6" />
    <path d="M400,246 L416,295 L468,295 L426,326 L442,376 L400,345 L358,376 L374,326 L332,295 L384,295 Z" fill="#3A2766" opacity=".85" />
    <ellipse cx="341" cy="252" rx="26" ry="12" transform="rotate(-40 341 252)" fill="#FFF6FB" opacity=".85" />
  </g>

  <text x="406" y="650" text-anchor="middle" font-family="Jost, sans-serif" font-weight="200" font-size="72" letter-spacing="12" fill="#FFF6FB">MONEDA DURA</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
