<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Los Ojos de Aitana" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .aitana-rise { animation: aitana-rise 12s ease-in-out infinite alternate; }
    .aitana-rays { animation: aitana-rays 4s ease-in-out infinite alternate; }
    .aitana-beam { transform-origin: 136px 482px; animation: aitana-beam 8s ease-in-out infinite alternate; }
    @keyframes aitana-rise { from { transform: translateY(84px); } 60%, to { transform: translateY(0); } }
    @keyframes aitana-rays { from { opacity: .35; } to { opacity: .95; } }
    @keyframes aitana-beam { from { transform: rotate(-10deg); } to { transform: rotate(6deg); } }
  </style>
  <defs>
    <linearGradient id="aitana-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1146" />
      <stop offset=".34" stop-color="#4A2F9A" />
      <stop offset=".52" stop-color="#C77FE0" />
      <stop offset=".64" stop-color="#FF9FDC" />
      <stop offset=".72" stop-color="#FFE45C" />
    </linearGradient>
    <linearGradient id="aitana-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1A8" />
      <stop offset="1" stop-color="#FF7CC8" />
    </linearGradient>
    <clipPath id="aitana-above"><rect width="800" height="572" /></clipPath>
  </defs>

  <rect width="800" height="800" fill="url(#aitana-sky)" />

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#9EE7F2" opacity=".7">III</text>
  <text x="409" y="214" text-anchor="middle" font-family="Jost, sans-serif" font-weight="200" font-size="88" letter-spacing="18" fill="#FFF6FB">LOS OJOS</text>
  <text x="407" y="264" text-anchor="middle" font-family="'Space Mono', monospace" font-size="24" letter-spacing="14" fill="#FFF6FB" opacity=".85">DE AITANA</text>

  <!-- two suns come up over the sea like two eyes -->
  <g clip-path="url(#aitana-above)">
    <g class="aitana-rise">
      <path class="aitana-rays" d="M170,482 L147,466 M213,444 L199,419 M268,430 L268,402 M323,444 L337,419 M366,482 L389,466 M434,482 L411,466 M477,444 L463,419 M532,430 L532,402 M587,444 L601,419 M630,482 L653,466" fill="none" stroke="#FFF6FB" stroke-width="4" stroke-linecap="round" />
      <circle cx="268" cy="548" r="104" fill="url(#aitana-sun)" />
      <circle cx="268" cy="548" r="62" fill="none" stroke="#3A2766" stroke-width="3" opacity=".55" />
      <circle cx="268" cy="518" r="30" fill="#3A2766" />
      <circle cx="282" cy="504" r="10" fill="#FFF6FB" />
      <circle cx="532" cy="548" r="104" fill="url(#aitana-sun)" />
      <circle cx="532" cy="548" r="62" fill="none" stroke="#3A2766" stroke-width="3" opacity=".55" />
      <circle cx="532" cy="518" r="30" fill="#3A2766" />
      <circle cx="546" cy="504" r="10" fill="#FFF6FB" />
    </g>
  </g>

  <!-- sea -->
  <rect y="572" width="800" height="228" fill="#2F1F63" />
  <g stroke="#FF9FDC" stroke-width="3" stroke-linecap="round">
    <path d="M208,606 L328,606 M228,632 L308,632 M246,658 L290,658" opacity=".75" />
    <path d="M472,606 L592,606 M492,632 L572,632 M510,658 L554,658" opacity=".75" />
  </g>

  <!-- the city at the edges: lighthouse on its fort, houses and a dome; the sea wall in front -->
  <path class="aitana-beam" d="M136,482 L330,452 L330,474 Z" fill="#FFF6FB" opacity=".4" />
  <g fill="#1B1146">
    <path d="M56,572 L56,540 L80,540 L80,550 L104,550 L104,540 L176,540 L176,572 Z" />
    <path d="M122,540 L127,490 L145,490 L150,540 Z" />
    <rect x="120" y="478" width="32" height="12" />
    <path d="M126,478 L136,458 L146,478 Z" />
    <rect x="596" y="552" width="150" height="20" />
    <path d="M630,552 L630,530 A32,32 0 0 1 694,530 L694,552 Z" />
    <rect x="655" y="476" width="14" height="24" />
    <path d="M650,476 L662,456 L674,476 Z" />
    <rect x="704" y="528" width="40" height="44" />
    <rect x="0" y="566" width="800" height="16" />
  </g>

  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".25" />
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
