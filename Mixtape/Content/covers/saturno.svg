    <circle class="saturno-star" style="animation-delay: -5.2s" cx="110" cy="470" r="2.5" />
    <circle opacity=".55" cx="560" cy="540" r="2" />
    <circle class="saturno-star" style="animation-delay: -7.8s" cx="230" cy="540" r="2" />
    <circle opacity=".55" cx="480" cy="90" r="2" />
  </g>
  <g class="saturno-planet">
  <g transform="rotate(-16 400 310)" fill="none">
    <path d="M138,310 A262,66 0 0 1 662,310" stroke="#9EE7F2" stroke-width="16" />
