<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Saturno" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .saturno-planet { animation: saturno-float 6s ease-in-out infinite alternate; }
    .saturno-dust { animation: saturno-dust 6s linear infinite; }
    .saturno-star { animation: saturno-star 4s ease-in-out infinite alternate; }
    @keyframes saturno-float { from { transform: translateY(-8px); } to { transform: translateY(8px); } }
    @keyframes saturno-dust { to { stroke-dashoffset: -160; } }
    @keyframes saturno-star { from { opacity: .2; } to { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="saturno-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1146" /><stop offset="0.6" stop-color="#2F1F63" /><stop offset="1" stop-color="#6E59C2" /></linearGradient>
    <linearGradient id="saturno-body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE45C" /><stop offset="1" stop-color="#FF7CC8" /></linearGradient>
    <clipPath id="saturno-round"><circle cx="400" cy="310" r="132" /></clipPath>
  </defs>

  <rect width="800" height="800" fill="url(#saturno-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".25" />
  <g fill="#FFF6FB">
