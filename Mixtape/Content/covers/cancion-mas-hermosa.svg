<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="La Canción Más Hermosa del Mundo" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .hermosa-note { animation: hermosa-note 3.2s ease-in-out infinite alternate; }
    .hermosa-star { animation: hermosa-star 4s ease-in-out infinite alternate; }
    .hermosa-world { transform-origin: 400px 290px; animation: hermosa-world 9s ease-in-out infinite alternate; }
    @keyframes hermosa-note { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
    @keyframes hermosa-star { from { opacity: .2; } to { opacity: 1; } }
    @keyframes hermosa-world { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  </style>
  <defs>
    <linearGradient id="hermosa-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B1146" /><stop offset="1" stop-color="#4A2F9A" /></linearGradient>
    <linearGradient id="hermosa-globe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FDBEA" /><stop offset="1" stop-color="#6E59C2" /></linearGradient>
    <clipPath id="hermosa-round"><circle cx="400" cy="290" r="140" /></clipPath>
  </defs>

  <rect width="800" height="800" fill="url(#hermosa-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".25" />
  <g fill="#FFF6FB">
    <circle class="hermosa-star" style="animation-delay: -0.0s" cx="140" cy="160" r="3" />
    <circle opacity=".55" cx="660" cy="130" r="2.5" />
    <circle class="hermosa-star" style="animation-delay: -2.6s" cx="250" cy="96" r="2" />
    <circle opacity=".55" cx="590" cy="470" r="2.5" />
    <circle class="hermosa-star" style="animation-delay: -5.2s" cx="120" cy="430" r="2.5" />
    <circle opacity=".55" cx="700" cy="300" r="2" />
    <circle class="hermosa-star" style="animation-delay: -7.8s" cx="520" cy="100" r="2" />
  </g>
  <g transform="rotate(-16 400 290)" fill="none" stroke="#FFF6FB" stroke-width="1.5" opacity=".75">
    <path d="M180,290 A220,54 0 0 1 620,290" />
    <path d="M168,290 A232,62 0 0 1 632,290" />
    <path d="M156,290 A244,70 0 0 1 644,290" />
  </g>
  <g class="hermosa-world"><circle cx="400" cy="290" r="140" fill="url(#hermosa-globe)" />
  <g clip-path="url(#hermosa-round)" fill="none" stroke="#FFF6FB" stroke-width="2" opacity=".55"><ellipse cx="400" cy="290" rx="48" ry="140" /><ellipse cx="400" cy="290" rx="98" ry="140" /><path d="M240,290 L560,290 M240,238 L560,238 M240,342 L560,342 M240,190 L560,190 M240,390 L560,390" /></g></g>
  <g transform="rotate(-16 400 290)">
  <g fill="none" stroke="#FFF6FB" stroke-width="1.5" opacity=".9">
    <path d="M180,290 A220,54 0 0 0 620,290" />
    <path d="M168,290 A232,62 0 0 0 632,290" />
    <path d="M156,290 A244,70 0 0 0 644,290" />
  </g>
    <g class="hermosa-note" style="animation-delay: -0.0s"><ellipse cx="583" cy="328" rx="14" ry="10" transform="rotate(-20 583 328)" fill="#FFE45C" /><path d="M595,325 L595,278 l16,8" fill="none" stroke="#FFE45C" stroke-width="4" stroke-linecap="round" /></g>
    <g class="hermosa-note" style="animation-delay: -1.1s"><ellipse cx="392" cy="352" rx="14" ry="10" transform="rotate(-20 392 352)" fill="#FFE45C" /><path d="M404,349 L404,302 l16,8" fill="none" stroke="#FFE45C" stroke-width="4" stroke-linecap="round" /></g>
    <g class="hermosa-note" style="animation-delay: -2.2s"><ellipse cx="208" cy="325" rx="14" ry="10" transform="rotate(-20 208 325)" fill="#FFE45C" /><path d="M220,322 L220,275 l16,8" fill="none" stroke="#FFE45C" stroke-width="4" stroke-linecap="round" /></g>
  </g>
  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#9EE7F2" opacity=".7">III</text>
  <text x="406" y="548" text-anchor="middle" font-family="'Space Mono', monospace" font-size="22" letter-spacing="12" fill="#9EE7F2" opacity=".85">LA CANCIÓN MÁS</text>
  <text x="408" y="642" text-anchor="middle" font-family="Jost, sans-serif" font-weight="200" font-size="100" letter-spacing="16" fill="#FFF6FB">HERMOSA</text>
  <text x="406" y="700" text-anchor="middle" font-family="'Space Mono', monospace" font-size="22" letter-spacing="12" fill="#9EE7F2" opacity=".85">DEL MUNDO</text>
