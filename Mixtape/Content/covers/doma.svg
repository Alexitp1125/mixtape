<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Doma" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .doma-rein { stroke-dasharray: 14 20; animation: doma-flow 9s linear infinite; }
    .doma-ring { transform-box: fill-box; transform-origin: center; animation: doma-spin 30s linear infinite; }
    @keyframes doma-flow { to { stroke-dashoffset: -340; } }
    @keyframes doma-spin { to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="doma-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FB4F4" />
      <stop offset=".6" stop-color="#A9B6FF" />
      <stop offset="1" stop-color="#FF9FDC" />
    </linearGradient>
    <linearGradient id="doma-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6A6D7" />
      <stop offset="1" stop-color="#E77BC0" />
    </linearGradient>
    <mask id="doma-slices">
      <rect width="800" height="600" fill="#fff" />
      <rect y="498" width="800" height="4" fill="#000" />
      <rect y="524" width="800" height="7" fill="#000" />
      <rect y="551" width="800" height="10" fill="#000" />
      <rect y="579" width="800" height="13" fill="#000" />
    </mask>
  </defs>

  <rect width="800" height="800" fill="url(#doma-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#3A2766" stroke-width="1" opacity=".22" />

  <!-- sun on the horizon -->
  <circle cx="400" cy="470" r="170" fill="url(#doma-sun)" mask="url(#doma-slices)" />

  <!-- floor -->
  <g stroke="#3A2766" stroke-width="1">
    <line x1="56" y1="600" x2="744" y2="600" opacity=".55" />
    <line x1="56" y1="630" x2="744" y2="630" opacity=".3" />
    <line x1="56" y1="672" x2="744" y2="672" opacity=".22" />
    <line x1="56" y1="730" x2="744" y2="730" opacity=".15" />
  </g>

  <!-- rein and ring -->
  <path class="doma-rein" d="M84,760 C220,700 300,600 400,500 C478,422 538,372 594,348" fill="none" stroke="#3A2766" stroke-width="3" stroke-linecap="round" />
  <circle class="doma-ring" cx="630" cy="330" r="38" fill="none" stroke="#3A2766" stroke-width="3" stroke-dasharray="46 14" />

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#3A2766" opacity=".6">I</text>
  <text x="420" y="246" text-anchor="middle" font-family="Jost, sans-serif" font-weight="300" font-size="150" letter-spacing="40" fill="#3A2766">DOMA</text>
</svg>
