<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Pruébame a Ti" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pruebame-swing { transform-origin: 452px 150px; animation: pruebame-swing 5s ease-in-out infinite; }
    .pruebame-shine { animation: pruebame-shine 5s ease-in-out infinite; }
    @keyframes pruebame-swing { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes pruebame-shine { 0%, 100% { opacity: .9; } 50% { opacity: .45; } }
  </style>
  <defs>
    <linearGradient id="pruebame-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7CC8" />
      <stop offset="1" stop-color="#FFE45C" />
    </linearGradient>
    <linearGradient id="pruebame-cherry" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5FD1" />
      <stop offset="1" stop-color="#6E59C2" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#pruebame-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#3A2766" stroke-width="1" opacity=".22" />

  <!-- floor lines -->
  <g stroke="#3A2766" stroke-width="1">
    <line x1="56" y1="700" x2="744" y2="700" opacity=".3" />
    <line x1="56" y1="716" x2="744" y2="716" opacity=".2" />
    <line x1="56" y1="736" x2="744" y2="736" opacity=".12" />
  </g>

  <!-- two cherries on one stem, swinging -->
  <g class="pruebame-swing">
    <path d="M452,150 C440,230 380,290 330,360 M452,150 C470,240 500,300 506,372" fill="none" stroke="#3A2766" stroke-width="7" stroke-linecap="round" />
    <path d="M452,150 C500,108 560,110 590,140 C548,170 490,172 452,150 Z" fill="#7FDBEA" stroke="#3A2766" stroke-width="5" stroke-linejoin="round" />
    <circle cx="318" cy="420" r="92" fill="url(#pruebame-cherry)" />
    <circle cx="520" cy="436" r="92" fill="url(#pruebame-cherry)" />
    <ellipse class="pruebame-shine" cx="284" cy="384" rx="26" ry="16" transform="rotate(-35 284 384)" fill="#FFF6FB" />
    <ellipse class="pruebame-shine" cx="486" cy="400" rx="26" ry="16" transform="rotate(-35 486 400)" fill="#FFF6FB" />
  </g>

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#3A2766" opacity=".6">V</text>
  <text x="408" y="628" text-anchor="middle" font-family="Jost, sans-serif" font-weight="300" font-size="92" letter-spacing="16" fill="#3A2766">PRUÉBAME</text>
  <text x="406" y="676" text-anchor="middle" font-family="'Space Mono', monospace" font-size="28" letter-spacing="14" fill="#3A2766" opacity=".75">A TI</text>
</svg>
