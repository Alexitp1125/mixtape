<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Jósean Log" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .josean-ring { transform-box: fill-box; transform-origin: center; animation: josean-wave 4s ease-in-out infinite alternate; }
    .josean-ring-2 { animation-delay: -.6s; }
    .josean-ring-3 { animation-delay: -1.2s; }
    .josean-ring-4 { animation-delay: -1.8s; }
    .josean-ring-5 { animation-delay: -2.4s; }
    @keyframes josean-wave { from { transform: scale(.94); } to { transform: scale(1.06); } }
  </style>
  <defs>
    <linearGradient id="josean-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C" />
      <stop offset=".55" stop-color="#FF9FDC" />
      <stop offset="1" stop-color="#C9B8F5" />
    </linearGradient>
    <linearGradient id="josean-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5FD1" />
      <stop offset="1" stop-color="#6E59C2" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#josean-sky)" />
  <rect x="56" y="56" width="688" height="688" fill="none" stroke="#3A2766" stroke-width="1" opacity=".22" />

  <!-- sound waves around a sun -->
  <g fill="none" stroke="#3A2766">
    <circle class="josean-ring" cx="400" cy="320" r="84" stroke-width="3" opacity=".8" />
    <circle class="josean-ring josean-ring-2" cx="400" cy="320" r="114" stroke-width="3" opacity=".62" />
    <circle class="josean-ring josean-ring-3" cx="400" cy="320" r="144" stroke-width="2.5" opacity=".46" />
    <circle class="josean-ring josean-ring-4" cx="400" cy="320" r="174" stroke-width="2" opacity=".32" />
    <circle class="josean-ring josean-ring-5" cx="400" cy="320" r="204" stroke-width="2" opacity=".2" />
  </g>
  <circle cx="400" cy="320" r="56" fill="url(#josean-sun)" />

  <text x="407" y="650" text-anchor="middle" font-family="Jost, sans-serif" font-weight="300" font-size="80" letter-spacing="14" fill="#3A2766">JÓSEAN LOG</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
