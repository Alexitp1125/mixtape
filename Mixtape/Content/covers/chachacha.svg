<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Chachachá" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .cha-head { animation: cha-sweep 3.2s linear infinite; }
    .cha-1, .cha-2, .cha-3 { animation: cha-hit 3.2s linear infinite; }
    .cha-1 { animation-delay: -1.44s; }
    .cha-2 { animation-delay: -1s; }
    .cha-3 { animation-delay: -.56s; }
    @keyframes cha-sweep { from { transform: translateX(-40px); } to { transform: translateX(840px); } }
    @keyframes cha-hit { 0%, 55% { opacity: .3; } 62% { opacity: 1; } 100% { opacity: .3; } }
  </style>
  <defs>
    <linearGradient id="cha-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241650" />
      <stop offset=".7" stop-color="#2F1F63" />
      <stop offset="1" stop-color="#6E59C2" />
    </linearGradient>
  </defs>

  <!-- night sky and dance floor -->
  <rect width="800" height="520" fill="url(#cha-sky)" />
  <rect y="520" width="800" height="280" fill="#241650" />
  <g stroke="#7FDBEA" stroke-width="1" opacity=".45">
    <line x1="400" y1="520" x2="-480" y2="800" />
    <line x1="400" y1="520" x2="-370" y2="800" />
    <line x1="400" y1="520" x2="-260" y2="800" />
    <line x1="400" y1="520" x2="-150" y2="800" />
    <line x1="400" y1="520" x2="-40" y2="800" />
    <line x1="400" y1="520" x2="70" y2="800" />
    <line x1="400" y1="520" x2="180" y2="800" />
    <line x1="400" y1="520" x2="290" y2="800" />
    <line x1="400" y1="520" x2="400" y2="800" />
    <line x1="400" y1="520" x2="510" y2="800" />
    <line x1="400" y1="520" x2="620" y2="800" />
    <line x1="400" y1="520" x2="730" y2="800" />
    <line x1="400" y1="520" x2="840" y2="800" />
    <line x1="400" y1="520" x2="950" y2="800" />
    <line x1="400" y1="520" x2="1060" y2="800" />
    <line x1="400" y1="520" x2="1170" y2="800" />
    <line x1="400" y1="520" x2="1280" y2="800" />
    <line x1="0" y1="525.7" x2="800" y2="525.7" />
    <line x1="0" y1="542.9" x2="800" y2="542.9" />
    <line x1="0" y1="571.4" x2="800" y2="571.4" />
    <line x1="0" y1="611.4" x2="800" y2="611.4" />
    <line x1="0" y1="662.9" x2="800" y2="662.9" />
    <line x1="0" y1="725.7" x2="800" y2="725.7" />
  </g>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#F6A6D7" stroke-width="2" />

  <!-- playhead and the three hits -->
  <rect class="cha-head" x="0" y="120" width="2" height="350" fill="#FFF6FB" opacity=".75" />
  <g font-family="'Space Mono', monospace" font-weight="700" font-size="104" letter-spacing="6">
    <text class="cha-1" x="110" y="214" fill="#F4B9DF">CHA</text>
    <text class="cha-2" x="230" y="334" fill="#9EE7F2">CHA</text>
    <text class="cha-3" x="350" y="454" fill="#F6A6D7">CHÁ</text>
  </g>

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#FFF6FB" opacity=".7">II · 1 2 CHA CHA CHÁ</text>
</svg>
