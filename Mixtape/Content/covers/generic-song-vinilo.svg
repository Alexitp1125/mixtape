<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .gvinilo-record { transform-box: fill-box; transform-origin: center; animation: gvinilo-turn 24s linear infinite; }
    @keyframes gvinilo-turn { to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="gvinilo-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2F9A" />
      <stop offset="1" stop-color="#FF7CC8" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#gvinilo-sky)" />

  <!-- record, turning -->
  <g class="gvinilo-record">
    <circle cx="400" cy="320" r="190" fill="#1B1146" />
    <circle cx="400" cy="320" r="150" fill="none" stroke="#C9B8F5" stroke-width="1.5" stroke-dasharray="120 30" opacity=".4" />
    <circle cx="400" cy="320" r="110" fill="none" stroke="#C9B8F5" stroke-width="1.5" stroke-dasharray="60 20" opacity=".4" />
    <circle cx="400" cy="320" r="66" fill="#FFE45C" />
    <circle cx="400" cy="320" r="10" fill="#1B1146" />
  </g>

  <!--title #FFF6FB-->
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
