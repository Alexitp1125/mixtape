<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Beso" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .beso-l { animation: beso-close-l 4.4s ease-in-out infinite; }
    .beso-r { animation: beso-close-r 4.4s ease-in-out infinite; }
    @keyframes beso-close-l { 0%, 100% { transform: translateX(-60px); } 50% { transform: translateX(0); } }
    @keyframes beso-close-r { 0%, 100% { transform: translateX(60px); } 50% { transform: translateX(0); } }
  </style>
  <defs>
    <radialGradient id="beso-bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#FFF6FB" />
      <stop offset=".55" stop-color="#F4B9DF" />
      <stop offset="1" stop-color="#C9B8F5" />
    </radialGradient>
    <!-- the left circle, used to cut out where both circles meet -->
    <clipPath id="beso-left">
      <circle class="beso-l" cx="320" cy="350" r="130" />
    </clipPath>
  </defs>

  <rect width="800" height="800" fill="url(#beso-bg)" />

  <!-- two circles that meet; the overlap turns violet -->
  <circle class="beso-l" cx="320" cy="350" r="130" fill="#E77BC0" />
  <circle class="beso-r" cx="480" cy="350" r="130" fill="#7FDBEA" />
  <g clip-path="url(#beso-left)">
    <circle class="beso-r" cx="480" cy="350" r="130" fill="#6E59C2" />
  </g>

  <g font-family="Jost, sans-serif" font-weight="300" font-size="120" letter-spacing="12" fill="#3A2766">
    <text class="beso-l" x="392" y="640" text-anchor="end">BE</text>
    <text class="beso-r" x="408" y="640">SO</text>
  </g>

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#3A2766" opacity=".6">III</text>
</svg>
