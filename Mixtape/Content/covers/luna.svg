<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Luna" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .luna-shadow { animation: luna-phase 16s ease-in-out infinite alternate; }
    .luna-blink { animation: luna-blink 7s steps(1) infinite; }
    .luna-blink-late { animation-delay: -3.5s; }
    @keyframes luna-phase { from { transform: translateX(-330px); } to { transform: translateX(330px); } }
    @keyframes luna-blink { 0% { opacity: .9; } 70% { opacity: .15; } }
  </style>
  <defs>
    <linearGradient id="luna-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241650" />
      <stop offset=".55" stop-color="#2F1F63" />
      <stop offset=".82" stop-color="#6E59C2" />
      <stop offset="1" stop-color="#F4B9DF" />
    </linearGradient>
    <!-- moon phase: a shadow disc slides across the moon -->
    <mask id="luna-phase-mask">
      <rect width="800" height="800" fill="#fff" />
      <circle class="luna-shadow" cx="400" cy="290" r="152" fill="#000" />
    </mask>
  </defs>

  <rect width="800" height="800" fill="url(#luna-sky)" />

  <circle cx="400" cy="290" r="150" fill="none" stroke="#C9B8F5" stroke-width="1" opacity=".45" />
  <circle cx="400" cy="290" r="150" fill="#FFF6FB" mask="url(#luna-phase-mask)" />

  <text x="417" y="530" text-anchor="middle" font-family="Jost, sans-serif" font-weight="200" font-size="96" letter-spacing="34" fill="#FFF6FB">LUNA</text>

  <!-- city skyline -->
  <g fill="#241650" shape-rendering="crispEdges">
    <rect x="0" y="670" width="64" height="130" />
    <rect x="64" y="628" width="52" height="172" />
    <rect x="116" y="700" width="40" height="100" />
    <rect x="156" y="610" width="74" height="190" />
    <rect x="230" y="660" width="46" height="140" />
    <rect x="276" y="640" width="60" height="160" />
    <rect x="336" y="690" width="36" height="110" />
    <rect x="372" y="618" width="68" height="182" />
    <rect x="440" y="672" width="44" height="128" />
    <rect x="484" y="604" width="62" height="196" />
    <rect x="546" y="650" width="50" height="150" />
    <rect x="596" y="686" width="38" height="114" />
    <rect x="634" y="622" width="70" height="178" />
    <rect x="704" y="660" width="48" height="140" />
    <rect x="752" y="636" width="48" height="164" />
  </g>
  <g fill="#9EE7F2">
    <rect x="172" y="632" width="6" height="9" opacity=".8" />
    <rect class="luna-blink" x="196" y="658" width="6" height="9" />
    <rect x="390" y="640" width="6" height="9" opacity=".8" />
    <rect x="500" y="626" width="6" height="9" opacity=".8" />
    <rect class="luna-blink luna-blink-late" x="522" y="664" width="6" height="9" />
    <rect x="652" y="646" width="6" height="9" opacity=".8" />
  </g>

  <text x="96" y="104" font-family="'Space Mono', monospace" font-size="14" letter-spacing="5" fill="#9EE7F2" opacity=".7">IV</text>
</svg>
