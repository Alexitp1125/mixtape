<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .tape4-reel { transform-box: fill-box; transform-origin: center; animation: tape4-turn 9s linear infinite; }
    @keyframes tape4-turn { to { transform: rotate(360deg); } }
  </style>
  <defs>
    <linearGradient id="tape4-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD3A6" />
      <stop offset="1" stop-color="#CFF4FA" />
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#tape4-sky)" />

  <!-- cassette: body, label and the window with its two reels -->
  <rect x="110" y="214" width="580" height="372" rx="26" fill="#FFF1A8" stroke="#3A2766" stroke-width="5" />
  <rect x="150" y="250" width="500" height="206" rx="12" fill="#FF7CC8" stroke="#3A2766" stroke-width="3" />
  <!--label-->
  <line x1="180" y1="326" x2="620" y2="326" stroke="#3A2766" stroke-width="2" opacity=".5" />
  <rect x="236" y="350" width="328" height="86" rx="43" fill="#3A2766" opacity=".9" />
  <g class="tape4-reel">
    <circle cx="300" cy="393" r="30" fill="#FF7CC8" />
    <path d="M300,367 L300,419 M274,393 L326,393" stroke="#3A2766" stroke-width="6" />
  </g>
  <g class="tape4-reel">
    <circle cx="500" cy="393" r="30" fill="#FF7CC8" />
    <path d="M500,367 L500,419 M474,393 L526,393" stroke="#3A2766" stroke-width="6" />
  </g>
  <path d="M230,586 L262,500 L538,500 L570,586" fill="none" stroke="#3A2766" stroke-width="5" stroke-linejoin="round" />
  <circle cx="320" cy="548" r="9" fill="#3A2766" />
  <circle cx="480" cy="548" r="9" fill="#3A2766" />
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
