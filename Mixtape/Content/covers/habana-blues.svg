    .hblues-star { animation: hblues-star 4s ease-in-out infinite alternate; }
    @keyframes hblues-wave { to { transform: translateX(100px); } }
    @keyframes hblues-lamp { from { transform: scale(.3); opacity: .9; } to { transform: scale(1); opacity: 0; } }
    @keyframes hblues-star { from { opacity: .2; } to { opacity: 1; } }
